<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitolen · Reparto — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181C; --ink-soft:#3A4148;
    --paper:#F7F4EE; --paper-dim:#EDE8DD; --paper-card:#FFFFFF;
    --accent:#E8590C; --accent-deep:#B8430A;
    --ok:#2F9E44; --ok-bg:#E7F6EB;
    --danger:#C92A2A; --danger-bg:#FBEAEA;
    --purple:#7137C9; --purple-bg:#F1EAFB;
    --warn:#B8720A; --warn-bg:#FBF0DD;
    --line:#D8D2C2;
    --mono:'IBM Plex Mono', monospace; --sans:'IBM Plex Sans', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper-dim); font-family:var(--sans); color:var(--ink); }
  header{ background:var(--ink); color:var(--paper); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1{ font-family:var(--mono); font-size:14px; letter-spacing:.1em; text-transform:uppercase; margin:0; font-weight:500; }
  header h1 span{ color:var(--accent); }
  .who{ font-family:var(--mono); font-size:11px; color:#9AA0A6; }
  main{ max-width:1200px; margin:0 auto; padding:24px; }
  .card{ background:var(--paper-card); border:1px solid var(--line); border-radius:10px; margin-bottom:18px; }
  .card h2{ font-size:13.5px; margin:0; padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .card-body{ padding:16px 18px; }
  .filtros{ display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:12px; align-items:end; }
  .field label{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  input, select{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-family:var(--sans); font-size:14px; background:var(--paper); }
  button{ font-family:var(--sans); font-weight:600; font-size:13.5px; border:none; border-radius:6px; padding:10px 16px; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); padding:9px 12px; border-bottom:1px solid var(--line); }
  td{ padding:10px 12px; border-bottom:1px solid var(--paper-dim); }
  tr.fila-recorrido{ cursor:pointer; }
  tr.fila-recorrido:hover{ background:var(--paper); }
  .badge{ font-family:var(--mono); font-size:9.5px; padding:2px 8px; border-radius:20px; }
  .badge-ok{ background:var(--ok-bg); color:var(--ok); }
  .badge-danger{ background:var(--danger-bg); color:var(--danger); }
  .badge-purple{ background:var(--purple-bg); color:var(--purple); }
  .badge-warn{ background:var(--warn-bg); color:var(--warn); }
  .badge-dim{ background:var(--paper-dim); color:var(--ink-soft); }
  .login-wrap{ display:flex; justify-content:center; padding:60px 20px; }
  .login-card{ width:100%; max-width:360px; padding:32px 28px; text-align:center; }
  .login-card h3{ margin:0 0 20px 0; }
  .msg{ font-size:12.5px; padding:10px 12px; border-radius:6px; margin-bottom:12px; }
  .msg-err{ background:var(--danger-bg); color:var(--danger); }
  .hidden{ display:none; }
  .map-grid{ display:grid; grid-template-columns:280px 1fr; gap:0; }
  #mapaReplay{ height:480px; border-radius:0 0 10px 0; }
  .stop-list{ max-height:480px; overflow-y:auto; border-right:1px solid var(--line); }
  .stop-item{ padding:10px 14px; border-bottom:1px solid var(--paper-dim); font-size:12px; }
  .stop-item .n{ font-weight:600; }
  .stop-item .hora{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
</style>
</head>
<body>

<header>
  <h1>Vitolen <span>·</span> Reparto — Dashboard</h1>
  <div class="who" id="whoami"></div>
</header>

<main>

  <div id="vistaLogin" class="login-wrap">
    <div class="card login-card">
      <h3>Iniciar sesión</h3>
      <div id="loginMsg"></div>
      <div class="field" style="margin-bottom:12px;"><label>Email</label><input id="loginEmail" type="text"></div>
      <div class="field" style="margin-bottom:12px;"><label>Contraseña</label><input id="loginPass" type="password"></div>
      <button class="btn-primary" style="width:100%" onclick="login()">Ingresar</button>
    </div>
  </div>

  <div id="vistaApp" class="hidden">

    <div class="card">
      <h2>Filtros</h2>
      <div class="card-body">
        <div class="filtros">
          <div class="field"><label>Sucursal</label><select id="selectSucursal" onchange="buscar()"></select></div>
          <div class="field"><label>Desde</label><input id="fechaDesde" type="date"></div>
          <div class="field"><label>Hasta</label><input id="fechaHasta" type="date"></div>
          <button class="btn-primary" onclick="buscar()">Buscar</button>
        </div>
      </div>
    </div>

    <div class="card" id="cardTabla">
      <h2>Recorridos <span class="badge badge-dim" id="contadorRecorridos">0</span></h2>
      <div id="tablaMsg" style="padding:0 18px;"></div>
      <table>
        <thead><tr><th>Fecha</th><th>Operador</th><th>Inicio</th><th>Fin</th><th>Duración</th><th>Entregados</th><th>No entreg.</th><th>Visitados</th><th>Estado</th></tr></thead>
        <tbody id="tablaRecorridos"></tbody>
      </table>
    </div>

    <div class="card hidden" id="cardReplay">
      <h2>
        <span id="tituloReplay"></span>
        <button class="btn-ghost" onclick="cerrarReplay()">Cerrar</button>
      </h2>
      <div class="map-grid">
        <div class="stop-list" id="listaParadasReplay"></div>
        <div id="mapaReplay"></div>
      </div>
    </div>

  </div>
</main>

<script>
const SUPABASE_URL = "https://mkrotthmdikzgviiklwu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rcm90dGhtZGlremd2aWlrbHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDcxNjMsImV4cCI6MjEwMDcyMzE2M30.iJuZhIvYPtLg6Sxt9Z986KHesG3cYVe1KtSo0BcWw10";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let usuarioActual = null;
let perfilActual = null;
let sucursales = [];
let sucursalSeleccionada = null;
let mapaReplay = null;
let capasReplay = [];

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  msg.innerHTML = '';
  const { data, error } = await client.auth.signInWithPassword({ email, password: pass });
  if(error){ msg.innerHTML = `<div class="msg msg-err">${error.message}</div>`; return; }
  usuarioActual = data.user;
  await arrancar();
}

async function arrancar(){
  const { data: perfil, error } = await client.from('perfiles').select('*').eq('id', usuarioActual.id).single();
  if(error){ document.getElementById('loginMsg').innerHTML = `<div class="msg msg-err">${error.message}</div>`; return; }
  perfilActual = perfil;

  const { data: sucs } = await client.from('sucursales').select('*').order('nombre');
  sucursales = sucs || [];

  const selector = document.getElementById('selectSucursal');
  selector.innerHTML = '';
  if(perfilActual.rol === 'admin'){
    sucursales.forEach(s => { const o=document.createElement('option'); o.value=s.id; o.textContent=s.nombre; selector.appendChild(o); });
    selector.disabled = false;
    sucursalSeleccionada = sucursales.find(s => s.id === perfilActual.sucursal_id)?.id || sucursales[0]?.id;
  } else {
    const propia = sucursales.find(s => s.id === perfilActual.sucursal_id);
    const o=document.createElement('option'); o.value=propia?.id||''; o.textContent=propia?.nombre||'Sin sucursal'; selector.appendChild(o);
    selector.disabled = true;
    sucursalSeleccionada = propia?.id;
  }
  selector.value = sucursalSeleccionada;

  const hoy = new Date();
  const hace7 = new Date(); hace7.setDate(hoy.getDate() - 7);
  document.getElementById('fechaHasta').valueAsDate = hoy;
  document.getElementById('fechaDesde').valueAsDate = hace7;

  document.getElementById('whoami').textContent = `${perfilActual.nombre_completo} · ${perfilActual.rol.toUpperCase()}`;
  document.getElementById('vistaLogin').classList.add('hidden');
  document.getElementById('vistaApp').classList.remove('hidden');

  await buscar();
}

async function buscar(){
  sucursalSeleccionada = document.getElementById('selectSucursal').value;
  const desde = document.getElementById('fechaDesde').value;
  const hasta = document.getElementById('fechaHasta').value;
  const tbody = document.getElementById('tablaRecorridos');
  const msg = document.getElementById('tablaMsg');
  msg.innerHTML = ''; tbody.innerHTML = '';
  cerrarReplay();

  const { data, error } = await client
    .from('vista_resumen_recorridos')
    .select('*')
    .eq('sucursal_id', sucursalSeleccionada)
    .gte('fecha', desde)
    .lte('fecha', hasta)
    .order('fecha', { ascending:false });

  if(error){ msg.innerHTML = `<div class="msg msg-err">${error.message}</div>`; return; }

  document.getElementById('contadorRecorridos').textContent = data.length;

  data.forEach(r => {
    const inicio = r.iniciado_en ? new Date(r.iniciado_en) : null;
    const fin = r.finalizado_en ? new Date(r.finalizado_en) : null;
    let duracion = '—';
    if(inicio && fin){
      const mins = Math.round((fin - inicio) / 60000);
      duracion = `${Math.floor(mins/60)}h ${mins%60}m`;
    } else if(inicio && !fin){
      duracion = 'en curso';
    }

    const badgeEstado = r.estado === 'finalizado' ? 'badge-ok' : r.estado === 'en_curso' ? 'badge-warn' : 'badge-dim';

    const tr = document.createElement('tr');
    tr.className = 'fila-recorrido';
    tr.innerHTML = `
      <td>${r.fecha}</td>
      <td>${r.operador_nombre}</td>
      <td style="font-family:var(--mono);font-size:11.5px;">${inicio ? inicio.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '—'}</td>
      <td style="font-family:var(--mono);font-size:11.5px;">${fin ? fin.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '—'}</td>
      <td style="font-family:var(--mono);font-size:11.5px;">${duracion}</td>
      <td><span class="badge badge-ok">${r.entregados}</span></td>
      <td><span class="badge badge-danger">${r.no_entregados}</span></td>
      <td><span class="badge badge-purple">${r.visitados}</span></td>
      <td><span class="badge ${badgeEstado}">${r.estado.replace('_',' ')}</span></td>
    `;
    tr.onclick = () => abrirReplay(r);
    tbody.appendChild(tr);
  });
}

const COLOR_ESTADO = {
  entregado: '#2F9E44', visitado: '#7137C9',
  no_entregado_ausente: '#C92A2A', no_entregado_rechazado: '#C92A2A', no_entregado_direccion_incorrecta: '#C92A2A',
  reprogramado: '#B8720A', pendiente: '#D8D2C2',
};

async function abrirReplay(r){
  document.getElementById('cardReplay').classList.remove('hidden');
  document.getElementById('tituloReplay').textContent = `Recorrido de ${r.operador_nombre} — ${r.fecha}`;
  document.getElementById('cardReplay').scrollIntoView({ behavior:'smooth' });

  if(!mapaReplay){
    mapaReplay = L.map('mapaReplay');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap contributors' }).addTo(mapaReplay);
  }
  capasReplay.forEach(c => mapaReplay.removeLayer(c));
  capasReplay = [];

  const { data: posiciones } = await client.from('posiciones').select('lat, lng').eq('recorrido_id', r.id).order('registrado_en', { ascending:true });
  const { data: paradas } = await client.from('paradas').select('*, clientes(nombre)').eq('recorrido_id', r.id).order('orden');

  const bounds = [];

  if(posiciones && posiciones.length > 0){
    const puntos = posiciones.map(p => [p.lat, p.lng]);
    const linea = L.polyline(puntos, { color:'#14181C', weight:3, opacity:.5 }).addTo(mapaReplay);
    capasReplay.push(linea);
    puntos.forEach(p => bounds.push(p));
  }

  const lista = document.getElementById('listaParadasReplay');
  lista.innerHTML = '';
  (paradas || []).forEach(p => {
    const div = document.createElement('div');
    div.className = 'stop-item';
    const hora = p.marcado_en ? new Date(p.marcado_en).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : 'sin marcar';
    div.innerHTML = `<div class="n">${p.orden}. ${p.clientes?.nombre || '—'}</div><div class="hora">${p.estado.replace(/_/g,' ')} · ${hora}</div>`;
    lista.appendChild(div);

    if(p.lat_registrada && p.lng_registrada){
      const color = COLOR_ESTADO[p.estado] || '#D8D2C2';
      const m = L.circleMarker([p.lat_registrada, p.lng_registrada], { radius:7, color:'#fff', weight:2, fillColor:color, fillOpacity:1 })
        .bindTooltip(`${p.orden}. ${p.clientes?.nombre || ''}`)
        .addTo(mapaReplay);
      capasReplay.push(m);
      bounds.push([p.lat_registrada, p.lng_registrada]);
    }
  });

  setTimeout(() => {
    mapaReplay.invalidateSize();
    if(bounds.length > 0) mapaReplay.fitBounds(bounds, { padding:[30,30] });
    else mapaReplay.setView([-32.9468, -60.6393], 13);
  }, 100);
}

function cerrarReplay(){
  document.getElementById('cardReplay').classList.add('hidden');
}

document.getElementById('loginPass').addEventListener('keydown', (ev) => { if(ev.key === 'Enter') login(); });
</script>
</body>
</html>
